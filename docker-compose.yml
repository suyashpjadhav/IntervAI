services:
  mongo:
    image: mongo:7.0
    container_name: intervai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intervai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: intervai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/interview-master
      - REDIS_URL=redis://redis:6379
      - AUTO_START_WORKER=false
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:80
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: intervai-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/interview-master
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: intervai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
